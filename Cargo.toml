[workspace]
resolver = "2"
members = [
    "links",
    "constellation",
    "jetstream",
    "ufos",
    "ufos/fuzz",
    "spacedust",
    "slingshot",
    "quasar",
    "pocket",
]

[workspace.dependencies]
clap = { version = "4.5.56", features = ["derive", "env"] }
metrics = "0.24.5"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
metrics-util = "0.20.3"
thiserror = "2.0.18"
